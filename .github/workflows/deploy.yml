# Publica la app en GitHub Pages cada vez que se sube algo a la rama principal.
# Antes de publicar corre el chequeo de tipos, las pruebas unitarias y la compilación:
# si algo falla, no se publica.
#
# Una sola vez: en el repositorio, Settings → Pages → "Build and deployment" → Source: GitHub Actions.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/new-session-3ir6e3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        # Etapa 5: la URL y la clave pública (anon) de Supabase se guardan en
        # Settings → Secrets and variables → Actions → Variables y se leen aquí:
        # env:
        #   VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        #   VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
